<title>쿡매치 만들기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 만들 차례인 편이 위(펼침), 다 만든 편은 아래 접힘. 카드 = 편 번호 띠 + 훅 + 복사 버튼 줄 */
:root {
  --bg: #F1F3F4; --paper: #FFFFFF; --ink: #1A1D1F; --muted: #626A70; --line: #DADFE2;
  --accent: #2D4F8E; --accent-ink: #FFFFFF; --soft: #E7EDF7; --ok: #2F7A57; --cap: #F7F9FA;
  --warn: #A2620C; --warn-soft: #F8ECD9; --done: #4A5F8C;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131618; --paper: #1C2023; --ink: #E9ECEE; --muted: #9DA5AB; --line: #2E3438;
  --accent: #8FB0EE; --accent-ink: #0F1626; --soft: #22304A; --ok: #7CCBA5; --cap: #171B1E;
  --warn: #E3A54D; --warn-soft: #3A2E1B; --done: #9FB2DF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131618; --paper: #1C2023; --ink: #E9ECEE; --muted: #9DA5AB; --line: #2E3438;
  --accent: #8FB0EE; --accent-ink: #0F1626; --soft: #22304A; --ok: #7CCBA5; --cap: #171B1E;
  --warn: #E3A54D; --warn-soft: #3A2E1B; --done: #9FB2DF; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 22px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 24px; margin: 0; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 500 13.5px var(--sans); border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.main-tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.mtab { appearance: none; border: 0; background: none; font: 700 14.5px var(--sans); color: var(--muted); padding: 11px 8px; cursor: pointer; }
.mtab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mtab:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.section { display: flex; flex-direction: column; gap: 14px; }
.tcard { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.tcard.approved { border-left-color: var(--accent); } .tcard.posted { border-left-color: var(--done); }
.tcard.skip { border-left-color: var(--line); } .tcard.failed { border-left-color: var(--warn); }
.tmeta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; } .tmeta a { color: inherit; }
.quote { background: var(--cap); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
.comment { white-space: pre-wrap; overflow-wrap: anywhere; } .who { font-weight: 700; }
.tcard label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
.tcard textarea { width: 100%; box-sizing: border-box; font: 15px/1.55 var(--sans); color: var(--ink); background: var(--cap); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; min-height: 80px; }
.tcard textarea:focus-visible { outline: 2px solid var(--accent); }
.flag { font-size: 12px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 8px; }
.trow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.trow .btn { flex: 0 1 auto; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.state { font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); }
.state.posted { color: var(--done); } .state.failed { background: var(--warn-soft); color: var(--warn); } .state.skip { background: var(--cap); color: var(--muted); }
.photo img { border-radius: 8px; max-height: 260px; }
.pics { display: flex; gap: 6px; overflow-x: auto; }
.pics img, .pics video { max-height: 200px; flex: none; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.pill { padding: 2px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.how { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.how ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 3px; }
h2 { font-size: 15px; margin: 8px 0 0; }
.list { display: grid; gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.no { font-weight: 700; font-variant-numeric: tabular-nums; }
.feat { color: var(--muted); }
.st { margin-left: auto; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); }
.st.ok { background: transparent; color: var(--ok); border: 1px solid var(--line); }
h3 { margin: 0; font-size: 17px; line-height: 1.4; }
.hook { white-space: pre-line; font-weight: 700; font-size: 15px; border-left: 3px solid var(--accent); padding-left: 10px; }
.hook small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.why { font-size: 13.5px; color: var(--muted); margin: 0; }
.lines { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 2px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 130px; appearance: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 500 13.5px var(--sans); cursor: pointer; background: var(--paper); color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 var(--sans); background: var(--cap); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 240px; overflow: auto; }
details > summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; }
</style>

<div class="wrap">
  <header>
    <h1>쿡매치 만들기</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="main-tabs" role="group" aria-label="올릴 곳">
    <button class="mtab" type="button" data-m="ig" aria-pressed="true">인스타그램 업로드용</button>
    <button class="mtab" type="button" data-m="th" aria-pressed="false">스레드 업로드용</button>
  </div>
  <section class="section" id="ig">
  <div class="tabs" role="group" aria-label="형식">
    <button class="tab" type="button" data-t="hooks5" aria-pressed="true">후킹 5벌 (연기)</button>
    <button class="tab" type="button" data-t="hooks" aria-pressed="false">후킹 4벌</button>
    <button class="tab" type="button" data-t="talks" aria-pressed="false">출연자 셀카형</button>
  </div>
  <div class="how" id="how"></div>
  <h2 id="hTodo"></h2>
  <div class="list" id="todo"></div>
  <details id="doneBox"><summary id="hDone"></summary><div class="list" id="done"></div></details>
  </section>
  <section class="section" id="th" hidden>
    <div class="pills" id="tsum"></div>
    <div class="tabs" role="group" aria-label="종류">
      <button class="tab ttab" type="button" data-k="reply" aria-pressed="true">답글</button>
      <button class="tab ttab" type="button" data-k="post" aria-pressed="false">새 글</button>
    </div>
    <div class="how" id="thow"></div>
    <div class="list" id="tlist"><div class="empty">검토함을 불러오는 중이에요.</div></div>
  </section>
</div>
<div class="toast" id="toast" hidden>복사했어요</div>

<script>
const DATA = {"hooks5": [{"no": "01", "title": "나 지금도 몰라", "feature": "사진 한 장으로 냉장고 채우기(영수증·음식 사진)", "done": false, "why": "장 봐 온 날, 영수증을 버리면 뭘 샀는지 아무도 몰라요. 그래서 같은 걸 또 사고, 산 건 구석에서 시들죠. 「나 지금도 몰라」라는 남편의 솔직한 고백이 웃음 포인트예요.", "hook": "영수증 버리면\n뭐 샀는지 아무도 몰라요", "hookKind": "😂 현실 직시형", "demo": "01 사진 인식 — 영수증·장 본 사진 한 장으로 재료가 냉장고에 자동으로 들어가는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n장 봐 온 봉투가 놓인 주방 아일랜드 앞에서, 긴 영수증을 든 아내에게 남편이 「영수증은 왜 아직 들고 있어?」 묻자 아내가 「이거 버리면 우리 집 냉장고에 뭐 있는지 아무도 몰라」, 남편이 반 박자 뒤 「…맞아. 나 지금도 몰라」 하는 약 10초 장면. 그 첫 순간: 남편(남색 맨투맨) — 아일랜드에 손을 짚은 채 아내 손의 영수증을 턱으로 가리킨다.\n\n[등장인물]\n여자(아내) — 30대 중반, 어깨 길이 단발, 연노랑 카디건, 화면 왼쪽에서 두 손으로 길게 늘어진 흰 영수증 한 장을 들고 있다. 남자(남편) — 30대 중반, 짧은 머리, 남색 맨투맨, 화면 오른쪽에서 아일랜드에 두 손을 짚고 서 있다.\n\n[장소]\n저녁, 밝은 아파트 주방. 화면 가운데 앞 흰 아일랜드 위에 무지 장바구니 봉투 두 개가 이미 놓여 있고(채소 잎이 위로 조금 보임) 끝까지 움직이지 않는다. 뒤쪽에 문 하나짜리 흰 냉장고, 문은 닫혀 있다. 두 사람 모두 처음부터 화면 안에서 아일랜드를 사이에 두고 서 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 남색 맨투맨, 두 사람 = 두 사람, 여자 = 아내 · 연노랑 카디건\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~2.5초 · 남자: 아일랜드에 손을 짚은 채 아내 손의 영수증을 턱으로 가리킨다.\n   남자: \"영수증은 왜 아직 들고 있어?\" (가볍게, 궁금해서)\n2) 2.5~3초 · 두 사람: 아내가 영수증을 내려다본다. 둘 다 입을 다물고 있다. (말 없음)\n3) 3~7초 · 여자: 영수증을 든 채 남편을 보며 진지하게 말한다.\n   여자: \"이거 버리면... 우리 집 냉장고에 뭐 있는지 아무도 몰라.\" (진지하게, 중간에 반 박자 쉬고)\n4) 7~8초 · 남자: 잠깐 생각하듯 눈을 위로 굴린다. 둘 다 입을 다물고 있다. (말 없음)\n5) 8~10초 · 남자: 고개를 천천히 한 번 끄덕이며 담담하게 인정한다.\n   남자: \"...맞아. 나 지금도 몰라.\" (담담하게, 솔직하게)\n끝 장면: 영수증을 든 채 남편을 빤히 보는 아내, 태연하게 고개를 끄덕이는 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 장인물: 남자 = 남편 · 검은 앞치마, 여자 = 아내 · 흰 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~3초 · 남자: 폰 화면을 보다가 몸을 반쯤 돌려 식탁의 아내를 본다.\n   남자: \"자기야, 굴소스 없는데... 어떡해?\" (곤란한 듯, 말끝을 늘이며)\n2) 3~4.5초 · 여자: 머그를 쥔 채 고개만 들고 대수롭지 않게 말한다.\n   여자: \"없으면 빼.\" (무심하게, 바로)\n3) 4.5~5.5초 · 남자: 다시 폰 화면을 내려다본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 5.5~9초 · 남자: 화면에서 눈을 떼지 않고 무표정으로 말한다.\n   남자: \"...없는 거 다 빼고 나니까, 물이랑 소금만 남아.\" (무표정, 체념한 듯)\n5) 9~10초 · 여자: 머그를 쥔 채 웃음을 참으며 고개를 숙인다. (말 없음)\n끝 장면: 빈 냄비 앞에서 폰을 내려다보는 남편의 체념한 무표정, 뒤에서 웃음을 참는 아내.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 검은 앞치마, 여자 = 아내 · 흰 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~3초 · 남자: 폰 화면을 보다가 몸을 반쯤 돌려 식탁의 아내를 본다. (말 없음)\n2) 3~4.5초 · 여자: 머그를 쥔 채 고개만 들고 대수롭지 않게 말한다. (말 없음)\n3) 4.5~5.5초 · 남자: 다시 폰 화면을 내려다본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 5.5~9초 · 남자: 화면에서 눈을 떼지 않고 무표정으로 말한다. (말 없음)\n5) 9~10초 · 여자: 머그를 쥔 채 웃음을 참으며 고개를 숙인다. (말 없음)\n끝 장면: 빈 냄비 앞에서 폰을 내려다보는 남편의 체념한 무표정, 뒤에서 웃음을 참는 아내.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "03", "title": "…4초", "feature": "요리 모드 · 읽어주기", "done": false, "why": "손이 반죽 범벅이라 레시피를 읽어 달라고 했는데, 하필 그때 광고가 나와요. 「5초 뒤에 건너뛰기래」 다음에 들리는 남편의 카운트다운이 웃음 포인트예요.", "hook": "요리할 때 광고 나오면\n진짜 미쳐요", "hookKind": "😂 현실 직시형", "demo": "03 요리 모드 · 읽어주기 — 손 안 대고 단계별로 레시피를 소리 내어 읽어 주는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n두 손이 반죽 그릇에 들어가 있는 아내가 옆에서 폰을 든 남편에게 「다음 순서 뭐야? 빨리 읽어 줘」 하자, 남편이 「잠깐만… 광고 나왔어. 5초 뒤에 건너뛰기래」, 아내가 말없이 째려보자 남편이 「…4초」 하는 약 10초 장면. 그 첫 순간: 아내(연회색 맨투맨) — 손을 그릇에 넣은 채 고개만 남편 쪽으로 돌린다.\n\n[등장인물]\n여자(아내) — 30대 중반, 머리를 높이 묶음, 연회색 맨투맨 소매를 걷음, 화면 왼쪽 조리대 앞에서 두 손이 흰 반죽 그릇 안에 들어가 있다(손은 그릇 안에 그대로). 남자(남편) — 30대 중반, 짧은 머리, 베이지 니트, 화면 오른쪽에서 아내 옆에 서서 두 손으로 폰을 들고 있다(화면은 보는 사람 반대쪽).\n\n[장소]\n낮, 밝은 주방 조리대. 조리대 위에 흰 반죽 그릇 하나와 밀가루가 조금 흩어져 있고, 그 밖에는 비어 있다. 두 사람은 나란히, 몸을 서로 쪽으로 반쯤 돌리고 서 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 연회색 맨투맨, 남자 = 남편 · 베이지 니트\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(여자 한 번 → 남자 한 번 → 남자 한 번).\n1) 0~3초 · 여자: 손을 그릇에 넣은 채 고개만 남편 쪽으로 돌린다.\n   여자: \"자기야, 다음 순서 뭐야? 빨리 읽어 줘, 나 손 못 써.\" (급하게)\n2) 3~6.8초 · 남자: 폰 화면을 보다가 잠깐 멈추고, 미안한 듯 화면을 본 채 말한다.\n   남자: \"잠깐만... 광고 나왔어. 5초 뒤에 건너뛰기래.\" (머뭇거리며)\n3) 6.8~8.4초 · 여자: 손은 그릇에 둔 채 고개만 돌려 남편을 말없이 째려본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 8.4~10초 · 남자: 아내 눈을 피해 화면만 보며 작게 말한다.\n   남자: \"...4초.\" (작게, 눈치 보며)\n끝 장면: 반죽 그릇에 손을 넣은 채 째려보는 아내, 폰 화면만 보는 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 연회색 맨투맨, 남자 = 남편 · 베이지 니트\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~3초 · 여자: 손을 그릇에 넣은 채 고개만 남편 쪽으로 돌린다. (말 없음)\n2) 3~6.8초 · 남자: 폰 화면을 보다가 잠깐 멈추고, 미안한 듯 화면을 본 채 말한다. (말 없음)\n3) 6.8~8.4초 · 여자: 손은 그릇에 둔 채 고개만 돌려 남편을 말없이 째려본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 8.4~10초 · 남자: 아내 눈을 피해 화면만 보며 작게 말한다. (말 없음)\n끝 장면: 반죽 그릇에 손을 넣은 채 째려보는 아내, 폰 화면만 보는 남편.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "04", "title": "그건 캠핑이잖아", "feature": "일주일 식단 · 장보기 목록", "done": false, "why": "이번 주 장 볼 걸 정하자고 했는데 남편이 부르는 목록은 늘 똑같죠. 삼겹살·라면·맥주를 듣고 「그건 캠핑 가는 거잖아」로 받아치는 게 웃음 포인트예요.", "hook": "남편한테 장보기 목록\n불러 달라고 하면", "hookKind": "😂 반전형", "demo": "04 AI 식단 — 일주일 식단을 짜 주고 장 볼 목록까지 한 번에 만들어 주는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n소파에 나란히 앉아, 수첩을 든 아내가 「이번 주 장 볼 거 불러 봐」 하자 남편이 「삼겹살, 목살, 라면, 맥주… 아, 숯도」, 아내가 반 박자 뒤 「…그건 캠핑 가는 거잖아」 하는 약 10초 장면. 그 첫 순간: 아내(남색 니트) — 수첩과 펜을 든 채 남편 쪽을 본다.\n\n[등장인물]\n여자(아내) — 30대 후반, 긴 머리를 집게핀으로 올림, 남색 니트, 화면 왼쪽 소파에 앉아 왼손에 작은 흰 수첩, 오른손에 펜을 들고 있다(쓰지는 않는다). 남자(남편) — 30대 후반, 짧은 머리, 카키색 후드티, 화면 오른쪽 소파에 등을 기대고 앉아 있다.\n\n[장소]\n일요일 저녁 거실, 회색 소파 하나. 앞에 낮은 원목 테이블, 그 위에 머그잔 하나만 있다. 따뜻한 스탠드 조명.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 남색 니트, 남자 = 남편 · 카키색 후드티\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(여자 한 번 → 남자 한 번 → 여자 한 번).\n1) 0~2.5초 · 여자: 수첩과 펜을 든 채 남편 쪽을 본다.\n   여자: \"이번 주 장 볼 거, 하나씩 불러 봐.\" (가볍게, 적을 준비하듯)\n2) 2.5~6초 · 남자: 소파에 기댄 채 천장을 보며 하나씩 떠올리듯 말한다.\n   남자: \"음... 삼겹살, 목살, 라면, 맥주... 아, 숯도.\" (신나서, 하나씩 띄엄띄엄)\n3) 6~7초 · 여자: 펜을 든 손이 멈춘다. 둘 다 입을 다물고 있다. (말 없음)\n4) 7~9.5초 · 여자: 고개를 천천히 돌려 남편을 본다.\n   여자: \"...그건 캠핑 가는 거잖아.\" (어이없어서, 낮게)\n끝 장면: 수첩을 든 채 남편을 빤히 보는 아내, 왜 그러냐는 듯 눈만 끔벅이는 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 남색 니트, 남자 = 남편 · 카키색 후드티\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~2.5초 · 여자: 수첩과 펜을 든 채 남편 쪽을 본다. (말 없음)\n2) 2.5~6초 · 남자: 소파에 기댄 채 천장을 보며 하나씩 떠올리듯 말한다. (말 없음)\n3) 6~7초 · 여자: 펜을 든 손이 멈춘다. 둘 다 입을 다물고 있다. (말 없음)\n4) 7~9.5초 · 여자: 고개를 천천히 돌려 남편을 본다. (말 없음)\n끝 장면: 수첩을 든 채 남편을 빤히 보는 아내, 왜 그러냐는 듯 눈만 끔벅이는 남편.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "05", "title": "추석까지였어", "feature": "유통기한 임박 알림", "done": false, "why": "냉장고 구석에서 나온 두부, 날짜가 좀 지났나 싶었는데 한참 전이에요. 「하루 이틀은 괜찮아」 뒤에 나오는 「…추석까지였어」가 웃음 포인트예요.", "hook": "하루 이틀 지난 줄\n알았던 두부", "hookKind": "😂 반전형", "demo": "05 유통기한 알림 — 넣어 둔 재료의 유통기한을 계산해 다가오면 먼저 알려 주는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n열린 냉장고 앞에서 두부 한 모를 든 남편이 「자기야, 이 두부 날짜 지났는데?」 묻자 식탁의 아내가 「하루 이틀은 괜찮아, 그냥 먹어」, 남편이 두부를 들여다보다 「…추석까지였어」 하는 약 10초 장면. 남편이 주인공으로 화면 가운데 앞. 그 첫 순간: 남편(짙은 녹색 맨투맨) — 두부를 든 채 몸을 반쯤 돌려 아내를 본다.\n\n[등장인물]\n남자(남편 · 주인공) — 40대 초반, 짧은 머리에 안경, 짙은 녹색 맨투맨, 화면 가운데 앞 열린 냉장고 앞에서 오른손에 흰 두부 한 모(포장째)를 들고 있다. 여자(아내) — 40대 초반, 단발, 크림색 니트, 화면 오른쪽 뒤 식탁에 앉아 있다.\n\n[장소]\n저녁 주방. 화면 왼쪽에 문 하나짜리 흰 냉장고, 문은 처음부터 열려 있고 끝까지 그대로다. 칸은 반찬통·채소로 평범하게 차 있고 아무것도 움직이지 않는다. 식탁은 남편 뒤 2~3m, 그 위에 물컵 하나.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 짙은 녹색 맨투맨, 여자 = 아내 · 크림색 니트\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~2.5초 · 남자: 두부를 든 채 몸을 반쯤 돌려 아내를 본다.\n   남자: \"자기야, 이 두부 날짜 지났는데?\" (가볍게)\n2) 2.5~5.5초 · 여자: 식탁에 앉은 채 대수롭지 않게 손을 한 번 젓는다.\n   여자: \"며칠 지났는데? 하루 이틀은 괜찮아, 그냥 먹어.\" (대수롭지 않게)\n3) 5.5~7.5초 · 남자: 안경을 고쳐 쓰고 두부 포장을 가까이 들여다본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 7.5~10초 · 남자: 두부에서 눈을 떼지 않고 담담하게 말한다.\n   남자: \"...추석까지였어.\" (무표정, 담담하게)\n끝 장면: 두부를 든 채 굳은 남편, 뒤에서 입을 막는 아내.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 짙은 녹색 맨투맨, 여자 = 아내 · 크림색 니트\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~2.5초 · 남자: 두부를 든 채 몸을 반쯤 돌려 아내를 본다. (말 없음)\n2) 2.5~5.5초 · 여자: 식탁에 앉은 채 대수롭지 않게 손을 한 번 젓는다. (말 없음)\n3) 5.5~7.5초 · 남자: 안경을 고쳐 쓰고 두부 포장을 가까이 들여다본다. 둘 다 입을 다물고 있다. (말 없음)\n4) 7.5~10초 · 남자: 두부에서 눈을 떼지 않고 담담하게 말한다. (말 없음)\n끝 장면: 두부를 든 채 굳은 남편, 뒤에서 입을 막는 아내.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "06", "title": "그건 이름만 붙인 거잖아", "feature": "요리 AI · 말로 물어보기", "done": false, "why": "계란이랑 감자밖에 없을 때 「뭐 해 먹지?」 물으면 돌아오는 대답은 재료 이름을 붙인 요리명이죠. 「그건 그냥 이름 붙인 거잖아」가 웃음 포인트예요.", "hook": "계란이랑 감자로\n뭐 해 먹어요?", "hookKind": "🎯 질문형", "demo": "06 요리 AI — 「계란이랑 감자 있는데 뭐 해 먹지?」처럼 말하듯 물으면 내 재료로 만들 수 있는 레시피를 골라 주는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n아일랜드 위 계란 한 판과 감자 세 개를 보며 아내가 「계란이랑 감자밖에 없는데 뭐 해 먹어?」 묻자 남편이 진지하게 「…계란 감자 볶음?」, 아내가 「그건 그냥 이름 붙인 거잖아」 하는 약 9초 장면. 그 첫 순간: 아내(하늘색 셔츠) — 팔짱을 낀 채 아일랜드 위 계란과 감자를 내려다본다.\n\n[등장인물]\n여자(아내) — 20대 후반, 긴 머리를 낮게 묶음, 하늘색 셔츠, 화면 왼쪽에서 아일랜드에 팔짱을 끼고 서 있다. 남자(남편) — 20대 후반, 짧은 곱슬머리, 흰 티셔츠, 화면 오른쪽에서 아일랜드에 두 손을 짚고 서 있다.\n\n[장소]\n밝은 저녁 주방. 화면 가운데 앞 흰 아일랜드 위에 종이 계란판 하나(계란 여섯 개)와 감자 세 개가 조금 떨어져 놓여 있고 끝까지 움직이지 않는다. 그 밖에는 비어 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 하늘색 셔츠, 남자 = 남편 · 흰 티셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(여자 한 번 → 남자 한 번 → 여자 한 번).\n1) 0~3초 · 여자: 팔짱을 낀 채 아일랜드 위 계란과 감자를 내려다본다.\n   여자: \"계란이랑 감자밖에 없는데... 뭐 해 먹어?\" (막막하게, 말끝을 늘이며)\n2) 3~4초 · 남자: 턱을 문지르며 진지하게 생각한다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4~6.5초 · 남자: 자신 있게 아내를 보며 말한다.\n   남자: \"...계란 감자 볶음?\" (진지하게, 자신 있게)\n4) 6.5~9.5초 · 여자: 팔짱을 낀 채 고개만 돌려 남편을 본다.\n   여자: \"그건 그냥... 둘이 이름 붙인 거잖아.\" (어이없어서, 피식하며)\n끝 장면: 팔짱 낀 채 남편을 보는 아내, 뭐가 문제냐는 표정의 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 하늘색 셔츠, 남자 = 남편 · 흰 티셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~3초 · 여자: 팔짱을 낀 채 아일랜드 위 계란과 감자를 내려다본다. (말 없음)\n2) 3~4초 · 남자: 턱을 문지르며 진지하게 생각한다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4~6.5초 · 남자: 자신 있게 아내를 보며 말한다. (말 없음)\n4) 6.5~9.5초 · 여자: 팔짱을 낀 채 고개만 돌려 남편을 본다. (말 없음)\n끝 장면: 팔짱 낀 채 남편을 보는 아내, 뭐가 문제냐는 표정의 남편.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "07", "title": "그 별점은 누구 요리야", "feature": "검증된 진짜 레시피", "done": false, "why": "별점 5점 레시피를 열었는데 후기가 전부 「설탕 빼고, 간장 대신 소금 넣었어요」예요. 「그럼 그 별점은 누구 요리한테 준 거야?」가 웃음 포인트예요.", "hook": "별점 5점 레시피,\n후기를 읽어 봤더니", "hookKind": "🔍 디테일 분석형", "demo": "07 검증된 레시피 — 유튜브·네이버에서 많이 본 인기 레시피를 재료·순서만 정리해 보여 주는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n소파에 나란히 앉아 아내가 든 폰을 같이 보며, 아내가 「이거 별점 5점이야. 근데 후기가 다 '설탕 빼고 간장 대신 소금 넣었어요'래」, 남편이 반 박자 뒤 「…그럼 그 별점은 누구 요리한테 준 거야?」 하는 약 10초 장면. 그 첫 순간: 아내(연보라 니트) — 폰 화면을 보며 읽어 주듯 말한다. 엄지는 움직이지 않는다.\n\n[등장인물]\n여자(아내) — 30대 초반, 웨이브 긴 머리, 연보라 니트, 화면 왼쪽 소파에 앉아 두 손으로 폰을 들고 있다(화면은 보는 사람 반대쪽). 남자(남편) — 30대 초반, 짧은 머리, 회색 셔츠, 화면 오른쪽에 붙어 앉아 아내 어깨 너머로 폰을 같이 들여다본다.\n\n[장소]\n저녁 거실, 베이지 소파 하나와 뒤쪽 창가의 화분 하나. 따뜻한 스탠드 조명. 그 밖의 물건은 없다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 연보라 니트, 남자 = 남편 · 회색 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 2마디(여자 한 번 → 남자 한 번).\n1) 0~5.5초 · 여자: 폰 화면을 보며 읽어 주듯 말한다. 엄지는 움직이지 않는다.\n   여자: \"이거 별점 5점이야. 근데 후기가 다... '설탕 빼고, 간장 대신 소금 넣었어요'래.\" (읽어 주듯, 갸웃하며)\n2) 5.5~6.5초 · 남자: 화면을 들여다본 채 눈썹이 살짝 올라간다. 둘 다 입을 다물고 있다. (말 없음)\n3) 6.5~9.5초 · 남자: 고개를 들어 아내를 본다.\n   남자: \"...그럼 그 별점은 누구 요리한테 준 거야?\" (진지하게, 의아해서)\n끝 장면: 폰을 든 채 남편을 보며 대답을 못 하는 아내, 진지한 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 연보라 니트, 남자 = 남편 · 회색 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~5.5초 · 여자: 폰 화면을 보며 읽어 주듯 말한다. 엄지는 움직이지 않는다. (말 없음)\n2) 5.5~6.5초 · 남자: 화면을 들여다본 채 눈썹이 살짝 올라간다. 둘 다 입을 다물고 있다. (말 없음)\n3) 6.5~9.5초 · 남자: 고개를 들어 아내를 본다. (말 없음)\n끝 장면: 폰을 든 채 남편을 보며 대답을 못 하는 아내, 진지한 남편.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "08", "title": "말 안 할래", "feature": "가족 · 아낀 돈", "done": false, "why": "요리라면 질색하던 남편이 앞치마를 두르고 있어요. 이유를 물으니 「이번 달 배달비 보고 나서」. 얼마였냐는 말에 「…말 안 할래」가 웃음 포인트예요 — 사용자 집 실제 이야기예요.", "hook": "요리 싫다던 남편이\n앞치마를 맨 이유", "hookKind": "💛 감정 공감형", "demo": "08 가족·아낀 돈 — 가족 집밥 목표와 요리할 때마다 쌓이는 아낀 돈(예상)이 보이는 화면", "copies": [{"label": "① 첫 장면 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n퇴근해 가방을 멘 채 주방 입구에 선 아내가 앞치마 차림으로 가스레인지 앞에 선 남편을 보고 「…자기가 요리를 해?」, 남편이 「응. 이번 달 배달비 내역 보고 나서 시작했어」, 아내가 「얼마였는데?」 묻자 남편이 「…말 안 할래」 하는 약 10초 장면. 남편이 주인공으로 화면 가운데 앞. 그 첫 순간: 아내(베이지 트렌치코트) — 가방을 멘 채 입구에서 눈이 살짝 커진다.\n\n[등장인물]\n남자(남편 · 주인공) — 30대 후반, 짧은 머리, 흰 티셔츠 위에 진한 갈색 앞치마, 화면 가운데 앞 가스레인지 앞에서 오른손에 나무 주걱을 들고 있다. 여자(아내) — 30대 후반, 어깨 아래 생머리, 베이지 트렌치코트, 화면 오른쪽 뒤 주방 입구에 서서 어깨에 가방을 메고 있다.\n\n[장소]\n저녁 주방, 따뜻한 조명. 가스레인지 위 프라이팬 하나에 채소가 담겨 있고 김이 살짝 오른다. 그 밖의 조리대는 비어 있다. 아내는 처음부터 주방 입구에 서 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "② 영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 베이지 트렌치코트, 남자 = 남편 · 갈색 앞치마\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 4마디(여자 한 번 → 남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~2.5초 · 여자: 가방을 멘 채 입구에서 눈이 살짝 커진다.\n   여자: \"...자기가 요리를 해?\" (놀라서, 반신반의)\n2) 2.5~5.3초 · 남자: 주걱을 든 채 고개만 돌려 태연하게 말한다.\n   남자: \"응. 이번 달 배달비 내역 보고 나서 시작했어.\" (태연하게)\n3) 5.3~7초 · 여자: 가방끈을 쥔 채 한 걸음도 움직이지 않고 묻는다.\n   여자: \"얼마였는데?\" (궁금해서)\n4) 7~8.3초 · 남자: 다시 프라이팬 쪽으로 고개를 돌린다. 둘 다 입을 다물고 있다. (말 없음)\n5) 8.3~10초 · 남자: 프라이팬만 보며 작게 말한다.\n   남자: \"...말 안 할래.\" (작게, 단호하게)\n끝 장면: 프라이팬만 보는 남편의 뒷모습 같은 옆얼굴, 입구에서 어이없어 웃는 아내.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 베이지 트렌치코트, 남자 = 남편 · 갈색 앞치마\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~2.5초 · 여자: 가방을 멘 채 입구에서 눈이 살짝 커진다. (말 없음)\n2) 2.5~5.3초 · 남자: 주걱을 든 채 고개만 돌려 태연하게 말한다. (말 없음)\n3) 5.3~7초 · 여자: 가방끈을 쥔 채 한 걸음도 움직이지 않고 묻는다. (말 없음)\n4) 7~8.3초 · 남자: 다시 프라이팬 쪽으로 고개를 돌린다. 둘 다 입을 다물고 있다. (말 없음)\n5) 8.3~10초 · 남자: 프라이팬만 보며 작게 말한다. (말 없음)\n끝 장면: 프라이팬만 보는 남편의 뒷모습 같은 옆얼굴, 입구에서 어이없어 웃는 아내.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}], "hooks": [{"no": "02", "title": "뒤에 저건 다 뭔데?", "feature": "사진 한 장으로 냉장고 채우기(데모 01)", "done": true, "why": "냉장고를 대충 보고 「먹을 게 없다」고 하는데, 정작 안쪽엔 잊어버린 재료가 잔뜩 쌓여 있죠. 냉장고 속을 몰라서 장을 또 보고 재료는 상해 가는 — 쿡매치가 내 냉장고 재료를 기억해 주는 이유예요.", "hook": "먹을 게 없다더니\n뒤에 이게 다 뭐야?", "hookKind": "🧠 상식 파괴형", "demo": "01 사진 인식 — 영수증·음식 사진 한 장으로 재료와 유통기한이 냉장고에 담기는 화면(냉장고 안쪽까지 앱이 기억)", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 회색 카디건, 여자 = 아내 · 오트밀색 스웨터\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 4마디(남자 한 번 → 여자 한 번 → 남자 한 번 → 여자 한 번).\n1) 0~1.5초 · 남자: 아일랜드 식탁에 팔꿈치를 대고 기대 서서 아내를 본다.\n   남자: \"오늘 저녁 뭐 먹어?\" (느긋하게)\n2) 1.5~4초 · 여자: 열린 냉장고 안을 들여다보다가, 투명 랩에 싼 양배추 반 통을 왼손으로, 투명 포장 소시지 1개를 오른손으로 차례로 꺼내 들고 남편 쪽으로 돌아선다. 두 재료는 끝까지 아내 손에 있다.\n   여자: \"음... 양배추 반 통이랑... 소시지? 이게 다야. 뭐 해 먹지...\" (한숨 섞어)\n3) 4~5.5초 · 남자: 식탁에서 몸을 떼고 냉장고 쪽으로 두 걸음 와서, 아내 어깨 너머로 냉장고 안을 들여다보며 눈을 가늘게 뜬다. (말 없음)\n4) 5.5~6.5초 · 남자: 냉장고 안을 본 채로.\n   남자: \"...뒤에 저건 다 뭔데?\" (천천히)\n5) 6.5~8초 · 여자: 재료를 든 채 돌아서 냉장고 안을 들여다보고 멈칫한다.\n   여자: \"...어? 저거 언제 샀지...\" (작게)\n끝 장면: 열린 냉장고 문 앞에서 안을 들여다보며 멈칫한 두 사람의 얼굴. 냉장고 안은 끝까지 보이지 않는다.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n아내가 냉장고에서 양배추 반 통과 소시지를 꺼내며 「이게 다야」라고 하자, 남편이 냉장고 안을 들여다보고 「뒤에 저건 다 뭔데?」라고 묻는 약 8초 장면. 냉장고 안은 보는 사람에게 끝까지 보이지 않는다. 그 첫 순간: 남편(회색 카디건) — 아일랜드 식탁에 팔꿈치를 대고 기대 서서 아내를 본다.\n\n[등장인물]\n여자(아내) — 30대 중반, 어깨 길이 머리, 오트밀색 스웨터. 남자(남편) — 30대 중반, 짧은 머리, 회색 카디건.\n\n[장소]\n저녁 주방, 따뜻한 펜던트 조명. 화면 왼쪽 벽에 사람 키만 한 문 하나짜리 흰 냉장고. 냉장고 문은 처음부터 보는 사람 쪽으로 활짝 열려 있어서, 보는 사람에게는 문 바깥면만 보이고 냉장고 안은 보이지 않는다. 주방에 있는 가전은 이 냉장고 하나뿐이고, 화면 아래쪽은 깨끗한 나무 바닥이다. 화면 오른쪽에 나무 아일랜드 식탁, 위에는 아무것도 없다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 회색 카디건, 여자 = 아내 · 오트밀색 스웨터\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~1.5초 · 남자: 아일랜드 식탁에 팔꿈치를 대고 기대 서서 아내를 본다. (말 없음)\n2) 1.5~4초 · 여자: 열린 냉장고 안을 들여다보다가, 투명 랩에 싼 양배추 반 통을 왼손으로, 투명 포장 소시지 1개를 오른손으로 차례로 꺼내 들고 남편 쪽으로 돌아선다. 두 재료는 끝까지 아내 손에 있다. (말 없음)\n3) 4~5.5초 · 남자: 식탁에서 몸을 떼고 냉장고 쪽으로 두 걸음 와서, 아내 어깨 너머로 냉장고 안을 들여다보며 눈을 가늘게 뜬다. (말 없음)\n4) 5.5~6.5초 · 남자: 냉장고 안을 본 채로. (말 없음)\n5) 6.5~8초 · 여자: 재료를 든 채 돌아서 냉장고 안을 들여다보고 멈칫한다. (말 없음)\n끝 장면: 열린 냉장고 문 앞에서 안을 들여다보며 멈칫한 두 사람의 얼굴. 냉장고 안은 끝까지 보이지 않는다.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}, {"label": "추가 컷(냉장고 안쪽)", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n약 3초짜리 한 컷. 문이 열린 흰 냉장고 안을 정면에서 가까이 본 장면. 사람은 나오지 않는다.\n\n[보이는 것]\n칸마다 무늬 없는 반찬통, 채소, 달걀, 두부, 소스병, 투명 봉지가 빽빽하게 쌓여 있다. 가운데 칸 한 자리만 조금 비어 있다. 냉장고 안 조명의 밝은 흰빛.\n\n[꼭 지킬 것]\n화면이 냉장고 안쪽으로 아주 천천히 조금 다가간다. 냉장고 안 물건은 하나도 움직이지 않고, 개수와 모양이 끝까지 같다. 화면 위에는 글자가 하나도 없다. 냉장고의 낮은 웅 소리만, 음악 없음.\n\n9:16 세로(1080×1920) 인스타그램 릴스 영상으로."}]}, {"no": "03", "title": "그럼 코로 눌러 봐", "feature": "요리 모드 · 손 안 대고 넘기기", "done": true, "why": "요리하다 레시피 화면이 꺼지면 손이 비어 있지 않아서 난감하죠. 냄비를 든 채 부탁했더니 「코로 눌러」가 돌아오는 게 웃음 포인트예요.", "hook": "오븐 장갑 끼고\n화면을 켠다고?", "hookKind": "🧠 상식 파괴형", "demo": "03 요리 모드 — 화면을 안 만져도 단계별로 읽어 주고 지금 단계를 짚어 주는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 여자 · 하늘색 앞치마, 남자 = 남자친구 · 검은 후드티, 뒤쪽 식탁\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 5마디(여자 한 번 → 여자 한 번 → 남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~2초 · 여자: 냄비를 든 채 거치대의 폰을 보고 있다. 폰 화면의 빛이 천천히 꺼진다.\n   여자: \"다음에 뭐 넣어야 되더라... 어, 어, 꺼진다... 아, 꺼졌다.\" (다급하게)\n2) 2~4초 · 여자: 냄비를 든 채 몸만 뒤쪽 남자친구에게 돌린다.\n   여자: \"자기야~ 이것 좀 켜 줘. 나 손 없어.\" (애교 섞어)\n3) 4~5초 · 남자: 자기 폰에서 눈도 안 떼고 입만 움직인다. 여자는 입을 다물고 있다.\n   남자: \"팔꿈치로 눌러.\" (낮은 목소리, 무심하게)\n4) 5~6.5초 · 여자: 냄비를 살짝 들어 보인다. 남자친구는 입을 다물고 있다.\n   여자: \"냄비 들고 있잖아.\" (어이없어서)\n5) 6.5~8초 · 남자: 그제야 고개를 들고 진지한 얼굴로 여자를 본다.\n   남자: \"...그럼 코로.\" (낮은 목소리, 진지하게)\n6) 8초 · 여자: 냄비를 든 채 웃음이 터지기 직전의 얼굴로 그를 노려본다. (말 없음)\n끝 장면: 냄비를 든 채 웃음을 참으며 노려보는 여자의 얼굴.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n냄비를 든 여자 앞에서 레시피 폰 화면이 꺼지고, 뒤 식탁의 남자친구에게 켜 달라고 하자 「팔꿈치로」, 「냄비 들고 있잖아」, 「…그럼 코로」가 오가는 약 8초 장면. 그 첫 순간: 여자(하늘색 앞치마) — 냄비를 든 채 거치대의 폰을 보고 있다. 폰 화면의 빛이 천천히 꺼진다.\n\n[등장인물]\n여자 — 20대 후반, 높이 묶은 머리, 하늘색 앞치마, 양손에 두꺼운 회색 오븐 장갑, 뚜껑 덮인 작은 흰 냄비를 양손으로 들고 있다. 남자(남자친구) — 20대 후반, 검은 후드티, 화면 뒤쪽 식탁에 앉아 자기 폰을 들고 있다(화면은 보는 사람 반대쪽).\n\n[장소]\n낮의 밝은 주방. 화면 앞쪽 조리대에 무지 폰 거치대 하나, 거기에 폰이 세워져 있고 화면이 부드럽게 빛난다. 화면 뒤쪽에 작은 식탁과 의자.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 여자 · 하늘색 앞치마, 남자 = 남자친구 · 검은 후드티, 뒤쪽 식탁\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~2초 · 여자: 냄비를 든 채 거치대의 폰을 보고 있다. 폰 화면의 빛이 천천히 꺼진다. (말 없음)\n2) 2~4초 · 여자: 냄비를 든 채 몸만 뒤쪽 남자친구에게 돌린다. (말 없음)\n3) 4~5초 · 남자: 자기 폰에서 눈도 안 떼고 입만 움직인다. 여자는 입을 다물고 있다. (말 없음)\n4) 5~6.5초 · 여자: 냄비를 살짝 들어 보인다. 남자친구는 입을 다물고 있다. (말 없음)\n5) 6.5~8초 · 남자: 그제야 고개를 들고 진지한 얼굴로 여자를 본다. (말 없음)\n6) 8초 · 여자: 냄비를 든 채 웃음이 터지기 직전의 얼굴로 그를 노려본다. (말 없음)\n끝 장면: 냄비를 든 채 웃음을 참으며 노려보는 여자의 얼굴.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "04", "title": "됐다 됐어, 정하지 말자", "feature": "장 볼 게 가장 적은 식단", "done": true, "why": "돈 아끼려고 「이번 주 메뉴 미리 정하자」 했는데, 둘이 번갈아 말하다 보니 일주일이 치킨·피자·족발·떡볶이로 채워지죠. 둘 다 진지한데 식단이 배달 메뉴판이 되는 게 웃음 포인트예요.", "hook": "일주일 식단 짰는데\n왜 다 배달이야?", "hookKind": "😂 현실 직시형", "demo": "04 AI 식단 — 원하는 조건을 말하면 냉장고 재료로 일주일 식단과 장볼 목록이 나오는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 15초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 크림색 스웨터, 남자 = 남편 · 회색 맨투맨, 두 사람 = 두 사람\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 8마디(여자 한 번 → 여자 한 번 → 남자 한 번 → 여자 한 번 → 남자 한 번 → 여자 한 번 → 남자 한 번 → 여자 한 번).\n1) 0~1.5초 · 여자: 폰을 보며 작게 한숨 쉰다.\n   여자: \"돈을 너무 많이 썼네...\" (혼잣말, 한숨 섞어)\n2) 1.5~4초 · 여자: 폰을 무릎 쪽으로 내리며 남편 쪽으로 몸을 돌린다.\n   여자: \"우리 이번 주 저녁 메뉴 좀 미리 정해 볼까? 월요일 뭐 먹을래?\" (다정하게)\n3) 4~5.5초 · 남자: 고민 없이 바로 대답하고 아내를 본다.\n   남자: \"월요일은 치킨. 화요일은?\" (가볍게)\n4) 5.5~7초 · 여자: 잠깐 생각하다 대답한다.\n   여자: \"화요일은... 피자. 수요일은?\" (생각하다가)\n5) 7~8.5초 · 남자: 신이 나서 바로 받는다.\n   남자: \"수요일은 족발. 목요일은?\" (신나서)\n6) 8.5~10초 · 여자: 입꼬리가 올라간다.\n   여자: \"목요일은... 떡볶이.\" (웃음 참으며)\n7) 10~11.5초 · 남자: 바로 받는다.\n   남자: \"금요일은 치킨.\" (당연하다는 듯)\n8) 11.5~12.5초 · 두 사람: 반 박자 멈추고 서로를 본다. (말 없음)\n9) 12.5~15초 · 여자: 손을 살짝 내저으며 웃는다. 남편도 따라 웃는다.\n   여자: \"됐다 됐어. 정하지 말자.\" (웃음 섞어)\n끝 장면: 손을 내저으며 웃는 아내와, 머그를 쥔 채 따라 웃는 남편.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n카드 내역을 본 아내가 이번 주 메뉴를 미리 정하자고 하는데, 둘이 요일을 번갈아 묻고 답하다 보니 전부 배달 메뉴가 되는 약 15초 장면. 그 첫 순간: 아내(크림색 스웨터) — 폰을 보며 작게 한숨 쉰다.\n\n[등장인물]\n여자(아내) — 30대 중반, 긴 머리를 귀 뒤로 넘김, 크림색 스웨터, 폰을 양손으로 들고 있다(화면은 보는 사람 반대쪽). 남자(남편) — 30대 중반, 짧은 머리, 회색 맨투맨, 머그를 감싸 쥐고 있다(마시지 않는다).\n\n[장소]\n창가의 소파, 오후의 부드러운 햇빛. 두 사람이 소파에 나란히 앉아 있다. 보이는 소품은 아내의 폰과 남편의 머그뿐.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 15초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 크림색 스웨터, 남자 = 남편 · 회색 맨투맨, 두 사람 = 두 사람\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~1.5초 · 여자: 폰을 보며 작게 한숨 쉰다. (말 없음)\n2) 1.5~4초 · 여자: 폰을 무릎 쪽으로 내리며 남편 쪽으로 몸을 돌린다. (말 없음)\n3) 4~5.5초 · 남자: 고민 없이 바로 대답하고 아내를 본다. (말 없음)\n4) 5.5~7초 · 여자: 잠깐 생각하다 대답한다. (말 없음)\n5) 7~8.5초 · 남자: 신이 나서 바로 받는다. (말 없음)\n6) 8.5~10초 · 여자: 입꼬리가 올라간다. (말 없음)\n7) 10~11.5초 · 남자: 바로 받는다. (말 없음)\n8) 11.5~12.5초 · 두 사람: 반 박자 멈추고 서로를 본다. (말 없음)\n9) 12.5~15초 · 여자: 손을 살짝 내저으며 웃는다. 남편도 따라 웃는다. (말 없음)\n끝 장면: 손을 내저으며 웃는 아내와, 머그를 쥔 채 따라 웃는 남편.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "05", "title": "그럼 자기가 먹어", "feature": "유통기한 임박 알림", "done": true, "why": "냉장고 구석에서 나온 요거트, 유통기한이 하루 지났을 때 다들 고민하죠. 「괜찮지?」 물었더니 「그럼 자기가 먹어」로 돌아오는 게 웃음 포인트예요.", "hook": "유통기한 어제,\n먹어? 말아?", "hookKind": "💛 감정 공감형", "demo": "05 유통기한 — 유통기한이 다가오면 알림이 오고, 임박 재료로 만들 레시피를 추천하는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 초록 카디건, 남자 = 남편 · 안경, 흰 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 2마디(여자 한 번 → 남자 한 번).\n1) 0~3.5초 · 여자: 가운데 칸 맨 안쪽 구석에서 요거트 컵 1개를 꺼내, 컵을 기울여 밑면의 날짜를 보고 눈을 찡그린 뒤, 기대하는 눈으로 남편을 본다.\n   여자: \"어제까지네... 하루 지난 건 괜찮지?\" (중얼거리다가 끝은 살짝 기대하며)\n2) 3.5~4.5초 · 남자: 아내 손의 컵을 한 번 내려다봤다가, 천천히 아내 얼굴로 눈을 옮긴다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.5~6초 · 남자: 무표정으로 아내를 본 채 짧게 말한다.\n   남자: \"그럼 자기가 먹어.\" (무표정, 담담하게)\n4) 6~8초 · 여자: 컵을 든 채 눈만 돌려 남편을 째려본다. 남편은 모른 척 시선을 피한다. 둘 다 말이 없다. (말 없음)\n끝 장면: 요거트 컵을 든 채 남편을 째려보는 아내의 눈.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n아내가 냉장고 구석에서 요거트를 꺼내 날짜를 보고 「어제까지네… 하루 지난 건 괜찮지?」라고 묻자, 잠깐 말없이 컵을 보던 남편이 「그럼 자기가 먹어」라고 하는 약 8초 장면. 대사는 딱 두 번이다: 여자 한 번, 그다음 남자 한 번. 그 첫 순간: 아내(초록 카디건) — 가운데 칸 맨 안쪽 구석에서 요거트 컵 1개를 꺼내, 컵을 기울여 밑면의 날짜를 보고 눈을 찡그린 뒤, 기대하는 눈으로 남편을 본다. 이 줄의 말은 처음부터 끝까지 아내 혼자 한다.\n\n[등장인물]\n여자(아내) — 40대 초반, 단발, 짙은 초록 카디건. 남자(남편) — 40대 초반, 얇은 안경, 흰 셔츠, 아내 바로 옆에 서 있다.\n\n[장소]\n아침 주방. 문 하나짜리 흰 냉장고, 문은 처음부터 열려 있다. 칸마다 반찬통·채소·달걀이 평범하게 차 있고 움직이지 않는다. 가운데 칸 맨 안쪽 구석에 작은 연분홍 요거트 컵(납작한 뚜껑) 딱 1개.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 초록 카디건, 남자 = 남편 · 안경, 흰 셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~3.5초 · 여자: 가운데 칸 맨 안쪽 구석에서 요거트 컵 1개를 꺼내, 컵을 기울여 밑면의 날짜를 보고 눈을 찡그린 뒤, 기대하는 눈으로 남편을 본다. (말 없음)\n2) 3.5~4.5초 · 남자: 아내 손의 컵을 한 번 내려다봤다가, 천천히 아내 얼굴로 눈을 옮긴다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.5~6초 · 남자: 무표정으로 아내를 본 채 짧게 말한다. (말 없음)\n4) 6~8초 · 여자: 컵을 든 채 눈만 돌려 남편을 째려본다. 남편은 모른 척 시선을 피한다. 둘 다 말이 없다. (말 없음)\n끝 장면: 요거트 컵을 든 채 남편을 째려보는 아내의 눈.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "06", "title": "열 개 다 마트 가래", "feature": "있는 재료로 매칭(데모 02) · 완성", "done": true, "why": "냉장고에 있는 걸로 해 먹으려고 레시피를 찾으면, 꼭 없는 재료를 사 오라고 하죠. 한참 찾다가 지쳐서 「배달 시킬까?」에 바로 고개를 끄덕이는 게 공감 포인트예요.", "hook": "레시피 열 개 봤는데\n다 장 보래요", "hookKind": "😂 현실 직시형", "demo": "02 매칭 — 내 냉장고 기준 매칭률 순, 없는 재료는 있는 걸로 대체(장 안 보고 해 먹기)", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 흰 티셔츠, 소파 뒤에 서 있음, 남자 = 남편 · 검은 니트, 화면 가운데 앞 소파에 앉음, 두 사람 = 두 사람\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(여자 한 번 → 남자 한 번 → 여자 한 번).\n1) 0~1.5초 · 여자: 소파 등받이에 두 팔을 얹은 채 앉아 있는 남편을 내려다본다.\n   여자: \"저녁 뭐 먹어?\" (편하게)\n2) 1.5~6초 · 남자: 폰을 엄지로 천천히 두세 번 넘기다가, 폰을 가슴 위에 엎어 놓고 소파에 등을 푹 기댄다. 폰은 남편 손 안에 있다.\n   남자: \"냉장고 파먹기 하려고 레시피를 열 개를 봤거든? 근데 열 개 다... 마트 가서 뭘 사 오래.\" (기운 없이, 끝은 허탈하게)\n3) 6~6.5초 · 두 사람: 반 박자 조용하다. (말 없음)\n4) 6.5~7.5초 · 여자: 조심스럽게 묻는다.\n   여자: \"...배달 시킬까?\" (조심스럽게)\n5) 7.5~8.5초 · 남자: 고개를 젖혀 아내를 올려다보고, 망설임 없이 한 번 크게 끄덕인다. (말 없음)\n끝 장면: 폰을 가슴에 엎은 채 아내를 올려다보는 남편의 안도한 얼굴.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n소파에서 레시피를 찾던 남편이 「열 개 다 마트 가서 사 오래」라며 지쳐 늘어지고, 아내의 「배달 시킬까?」에 바로 끄덕이는 약 8초 장면. 남편이 주인공으로 화면 가운데 앞에 있다. 그 첫 순간: 아내(흰 티셔츠, 소파 뒤에 서 있음) — 소파 등받이에 두 팔을 얹은 채 앉아 있는 남편을 내려다본다.\n\n[등장인물]\n남자(남편 · 주인공) — 30대 초반, 짧고 단정한 머리, 검은 니트, 화면 가운데 앞 소파에 앉아 폰을 양손으로 들고 있다(화면은 보는 사람 반대쪽). 여자(아내) — 30대 초반, 긴 머리를 낮게 묶음, 흰 티셔츠, 소파 뒤에 서서 등받이에 두 팔을 얹고 있다.\n\n[장소]\n저녁 거실, 따뜻한 스탠드 조명. 회색 소파 하나, 뒤로 단순한 흰 벽. 소품은 남편의 폰 하나뿐.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 8.5초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 흰 티셔츠, 소파 뒤에 서 있음, 남자 = 남편 · 검은 니트, 화면 가운데 앞 소파에 앉음, 두 사람 = 두 사람\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~1.5초 · 여자: 소파 등받이에 두 팔을 얹은 채 앉아 있는 남편을 내려다본다. (말 없음)\n2) 1.5~6초 · 남자: 폰을 엄지로 천천히 두세 번 넘기다가, 폰을 가슴 위에 엎어 놓고 소파에 등을 푹 기댄다. 폰은 남편 손 안에 있다. (말 없음)\n3) 6~6.5초 · 두 사람: 반 박자 조용하다. (말 없음)\n4) 6.5~7.5초 · 여자: 조심스럽게 묻는다. (말 없음)\n5) 7.5~8.5초 · 남자: 고개를 젖혀 아내를 올려다보고, 망설임 없이 한 번 크게 끄덕인다. (말 없음)\n끝 장면: 폰을 가슴에 엎은 채 아내를 올려다보는 남편의 안도한 얼굴.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "06B", "title": "나 말고 폰한테 물어봐", "feature": "요리 AI · 말로 물어보기", "done": true, "why": "냉장고 앞에서 「뭐 해 먹지?」를 하루에 몇 번씩 묻는 사람, 집에 꼭 있죠. 세 번째 질문에 「나 말고 폰한테 물어봐」가 돌아오는 게 웃음 포인트예요 — 정답은 진짜로 폰(쿡매치 AI)이에요.", "hook": "뭐 해 먹지는\n이제 폰한테 물어봐요", "hookKind": "🛠️ 해결책 제시형", "demo": "06 요리 AI — 「냉장고에 있는 걸로 뭐 해 먹지?」처럼 말하듯 물으면 내 재료로 맞는 레시피를 골라 주는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 회색 후드티, 냉장고 앞, 여자 = 아내 · 연베이지 니트, 소파\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 2마디(남자 한 번 → 여자 한 번).\n1) 0~3.5초 · 남자: 열린 냉장고 안을 들여다보다가, 몸을 반쯤 돌려 소파의 아내 쪽을 본다. 폰은 오른손에 그대로 있다.\n   남자: \"자기야, 두부랑 김치 있는데… 이걸로 뭐 해 먹지?\" (고민하듯, 말끝을 늘이며)\n2) 3.5~4.3초 · 여자: 자기 폰에서 눈을 떼지 않는다. 남편은 대답을 기다린다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.3~8.3초 · 여자: 폰을 보는 채로, 고개도 안 들고 대답한다.\n   여자: \"그거 오늘만 세 번째야… 나 말고 폰한테 물어봐. 걔가 더 잘 알아.\" (무심하게, 끝은 담담하게)\n4) 8.3~10초 · 남자: 잠깐 멈췄다가, 오른손에 든 자기 폰을 천천히 내려다본다. (말 없음)\n끝 장면: 열린 냉장고 앞에서 손에 든 폰을 내려다보는 남편, 뒤쪽 소파에서 폰을 보는 아내.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n열린 냉장고 앞에 선 남편이 「두부랑 김치 있는데 뭐 해 먹지?」라고 묻자, 소파에서 폰을 보던 아내가 고개도 안 들고 「그거 오늘만 세 번째야… 나 말고 폰한테 물어봐」라고 하고, 남편이 손에 든 자기 폰을 내려다보는 약 8초 장면. 그 첫 순간: 남편(회색 후드티, 냉장고 앞) — 열린 냉장고 안을 들여다보다가, 몸을 반쯤 돌려 소파의 아내 쪽을 본다. 폰은 오른손에 그대로 있다.\n\n[등장인물]\n남자(남편) — 30대 초반, 짧고 단정한 머리, 회색 후드티, 오른손에 자기 폰을 들고 있다(화면은 보는 사람 반대쪽). 여자(아내) — 30대 초반, 긴 머리를 하나로 묶음, 연베이지 니트, 소파에 앉아 자기 폰을 보고 있다(화면은 보는 사람 반대쪽).\n\n[장소]\n저녁, 주방과 거실이 이어진 아파트. 화면 왼쪽 앞에 문 하나짜리 흰 냉장고, 문은 처음부터 열려 있고 끝까지 그대로다. 가운데 칸에 흰 두부 한 모와 투명 김치통 하나가 보이고, 다른 칸은 반찬통·채소로 평범하게 차 있으며 아무것도 움직이지 않는다. 남편은 냉장고 앞에 서 있다. 화면 오른쪽 뒤, 3~4m 떨어진 거실에 회색 소파가 있고 아내가 앉아 있다. 두 사람 모두 처음부터 화면 안에 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 회색 후드티, 냉장고 앞, 여자 = 아내 · 연베이지 니트, 소파\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~3.5초 · 남자: 열린 냉장고 안을 들여다보다가, 몸을 반쯤 돌려 소파의 아내 쪽을 본다. 폰은 오른손에 그대로 있다. (말 없음)\n2) 3.5~4.3초 · 여자: 자기 폰에서 눈을 떼지 않는다. 남편은 대답을 기다린다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.3~8.3초 · 여자: 폰을 보는 채로, 고개도 안 들고 대답한다. (말 없음)\n4) 8.3~10초 · 남자: 잠깐 멈췄다가, 오른손에 든 자기 폰을 천천히 내려다본다. (말 없음)\n끝 장면: 열린 냉장고 앞에서 손에 든 폰을 내려다보는 남편, 뒤쪽 소파에서 폰을 보는 아내.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "07", "title": "아직 바다 보고 있어", "feature": "검증된 진짜 레시피", "done": true, "why": "블로그 레시피를 열면 레시피 전에 여행 이야기가 한참 나오죠. 프라이팬 앞에서 남의 제주도 여행기를 끝없이 내리는 남편의 체념한 무표정이 웃음 포인트예요.", "hook": "레시피 보려다\n남의 여행기만 봤어요", "hookKind": "😂 현실 직시형", "demo": "07 진짜 레시피 — 유튜브·네이버 인기 레시피를 재료·순서만 정리해 보여 주는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 회색 후드티, 남자 = 남편 · 올리브색 티셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 5마디(여자 한 번 → 남자 한 번 → 남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~1.5초 · 여자: 뒤에서 한두 걸음 다가온다.\n   여자: \"레시피 찾았어?\" (가볍게)\n2) 1.5~3.5초 · 남자: 폰을 보며 엄지로 화면을 천천히 계속 내린다. 미간이 조금 찌푸려진다.\n   남자: \"찾았는데... 이 사람이 아직 제주도에 있어.\" (멍하게)\n3) 3.5~4.5초 · 여자: 남편 어깨 너머로 폰을 들여다보며 고개를 갸웃한다. (말 없음)\n4) 4.5~6초 · 남자: 엄지를 멈추지 않고 무표정으로 말한다.\n   남자: \"아직 바다 보고 있어.\" (무표정, 담담하게)\n5) 6~7.5초 · 여자: 코로 웃음을 터뜨리고 한 손으로 입을 가린다.\n   여자: \"레시피는 맨 밑에 있어, 맨 밑에.\" (웃음 섞어)\n6) 7.5~9초 · 남자: 엄지를 계속 내리다 잠깐 멈추고, 무표정으로 화면을 본다.\n   남자: \"...이제 귤 따러 갔어.\" (무표정, 체념한 듯)\n끝 장면: 빈 프라이팬 앞에서 폰을 내려다보는 남편의 체념한 무표정, 뒤에서 웃음을 참는 아내.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n빈 프라이팬 앞에서 레시피를 찾던 남편이 「이 사람 아직 제주도에 있어」, 「아직 바다 보고 있어」라고 하고, 아내가 웃자 끝까지 스크롤을 내리며 「…이제 귤 따러 갔어」로 마무리하는 약 9초 장면. 남편이 주인공으로 화면 가운데 앞에 있다. 그 첫 순간: 아내(회색 후드티) — 뒤에서 한두 걸음 다가온다.\n\n[등장인물]\n남자(남편 · 주인공) — 30대 후반, 짧은 머리, 올리브색 티셔츠, 화면 가운데 앞 가스레인지 앞에서 오른손에 폰을 들고 있다(화면은 보는 사람 반대쪽), 왼손은 조리대에. 여자(아내) — 30대 후반, 머리를 집게핀으로 올림, 회색 후드티, 처음엔 남편 뒤쪽 한두 걸음 떨어져 서 있다.\n\n[장소]\n저녁 주방. 가스레인지 위에 빈 검은 프라이팬 하나, 불은 꺼져 있고 안은 비어 있다. 조리대는 그 밖에 비어 있다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 9초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 여자 = 아내 · 회색 후드티, 남자 = 남편 · 올리브색 티셔츠\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~1.5초 · 여자: 뒤에서 한두 걸음 다가온다. (말 없음)\n2) 1.5~3.5초 · 남자: 폰을 보며 엄지로 화면을 천천히 계속 내린다. 미간이 조금 찌푸려진다. (말 없음)\n3) 3.5~4.5초 · 여자: 남편 어깨 너머로 폰을 들여다보며 고개를 갸웃한다. (말 없음)\n4) 4.5~6초 · 남자: 엄지를 멈추지 않고 무표정으로 말한다. (말 없음)\n5) 6~7.5초 · 여자: 코로 웃음을 터뜨리고 한 손으로 입을 가린다. (말 없음)\n6) 7.5~9초 · 남자: 엄지를 계속 내리다 잠깐 멈추고, 무표정으로 화면을 본다. (말 없음)\n끝 장면: 빈 프라이팬 앞에서 폰을 내려다보는 남편의 체념한 무표정, 뒤에서 웃음을 참는 아내.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}, {"no": "08", "title": "그 돈으로 치킨 시키자", "feature": "가족 · 아낀 돈", "done": true, "why": "집밥 차려 놓고 「오늘 돈 아꼈다」 뿌듯해하는 순간, 꼭 그 돈을 다른 데 쓰자는 사람이 있어요. 아낀 돈이 바로 치킨이 되는 게 웃음 포인트예요.", "hook": "집밥으로 아낀 돈,\n어디에 써요?", "hookKind": "😂 반전형", "demo": "08 가족·아낀 돈 — 가족 집밥 목표와 요리할 때마다 쌓이는 아낀 돈(예상)이 보이는 화면", "copies": [{"label": "영상 프롬프트", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 남색 앞치마, 여자 = 아내 · 연분홍 스웨터\n\n대본 — 위에서 아래로 한 번씩. 대사는 딱 3마디(남자 한 번 → 여자 한 번 → 남자 한 번).\n1) 0~4초 · 남자: 들고 있던 채소 접시를 식탁 가운데에 천천히 내려놓는다. 접시는 내려놓은 자리에 그대로 있다.\n   남자: \"짠~ 오늘 집에서 해 먹으니까... 배달 시킨 거보다 이만 원은 아꼈다.\" (뿌듯하게)\n2) 4~4.8초 · 남자: 자기 의자에 앉으며 뿌듯하게 웃는다. 아내는 젓가락을 든 채 눈이 반짝인다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.8~7.3초 · 여자: 젓가락을 든 채 신이 나서 남편을 본다.\n   여자: \"그럼 그 돈으로... 오늘 치킨 시켜 먹자.\" (신나서, 중간에 반 박자 쉬고)\n4) 7.3~8.3초 · 남자: 뿌듯한 웃음이 그대로 굳는다. 1초 정적. (말 없음)\n5) 8.3~10초 · 남자: 무표정으로 아내를 본다.\n   남자: \"...그럼 안 아낀 거잖아.\" (낮게, 무표정으로)\n끝 장면: 웃음이 굳은 채 아내를 보는 남편의 무표정.\n\n지킬 것\n- 대사는 위에 적힌 것뿐이다. 한 마디는 한 사람이 처음부터 끝까지 말하고, 그동안 다른 사람은 입을 꾹 다문다. 「말 없음」 줄에는 아무도 말하지 않는다.\n- 여자 대사는 여자 목소리, 남자 대사는 낮은 남자 목소리. 서울말 반말, 괄호 속 말투대로 자연스럽게.\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음.", "main": true}, {"label": "첫 장면 이미지", "text": "인스타그램 릴스의 한 장면처럼, 폰을 세로로 세워 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[이 사진은 영상의 첫 장면]\n남편이 저녁을 차리며 「집에서 해 먹어서 이만 원 아꼈다」고 뿌듯해하자, 아내가 「그 돈으로 치킨 시켜 먹자」고 해서 남편의 웃음이 굳는 약 8초 장면. 남편이 주인공으로 화면 가운데 앞에 있다. 그 첫 순간: 남편(남색 앞치마) — 들고 있던 채소 접시를 식탁 가운데에 천천히 내려놓는다. 접시는 내려놓은 자리에 그대로 있다.\n\n[등장인물]\n남자(남편 · 주인공) — 30대 중반, 짧은 머리, 회색 티셔츠 위에 남색 앞치마, 볶은 채소가 담긴 흰 접시 하나를 들고 화면 가운데 앞 식탁 옆에 서 있다. 여자(아내) — 30대 중반, 낮게 묶은 포니테일, 연분홍 스웨터, 식탁에 앉아 나무젓가락을 들고 있다(먹지는 않는다).\n\n[장소]\n저녁 식탁, 따뜻한 펜던트 조명. 식탁 위에 흰 밥공기 두 개가 이미 놓여 있고 움직이지 않는다.\n\n[꼭 지킬 것]\n깔끔하고 호감 가는 한국인, 자연스럽고 편안한 표정, 보는 사람이 아니라 물건이나 서로를 본다. 부드러운 자연광과 따뜻한 조명, 눈높이. 여기 적은 물건만, 무늬·로고 없는 무지. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로."}, {"label": "대사 없는 버전", "text": "첨부한 사진을 첫 장면으로, 그대로 이어지는 약 10초짜리 9:16 세로 영상을 만들어 줘.\n\n등장인물: 남자 = 남편 · 남색 앞치마, 여자 = 아내 · 연분홍 스웨터\n\n대본 — 위에서 아래로 한 번씩. 대사 없이 표정과 동작만, 말소리는 없다.\n1) 0~4초 · 남자: 들고 있던 채소 접시를 식탁 가운데에 천천히 내려놓는다. 접시는 내려놓은 자리에 그대로 있다. (말 없음)\n2) 4~4.8초 · 남자: 자기 의자에 앉으며 뿌듯하게 웃는다. 아내는 젓가락을 든 채 눈이 반짝인다. 둘 다 입을 다물고 있다. (말 없음)\n3) 4.8~7.3초 · 여자: 젓가락을 든 채 신이 나서 남편을 본다. (말 없음)\n4) 7.3~8.3초 · 남자: 뿌듯한 웃음이 그대로 굳는다. 1초 정적. (말 없음)\n5) 8.3~10초 · 남자: 무표정으로 아내를 본다. (말 없음)\n끝 장면: 웃음이 굳은 채 아내를 보는 남편의 무표정.\n\n지킬 것\n- 사람·옷·장소·물건은 첨부한 사진 그대로. 사진에 없는 물건은 생기지 않고, 손에 든 물건은 끝까지 그 손에 있다. 손가락은 다섯 개.\n- 화면은 처음부터 끝까지 고정(흔들림·확대·이동 없음). 화면에 자막·글자 없음. 방 안 소리와 대사만, 음악 없음."}]}], "talks": [{"no": "01", "title": "요리할수록 돈이 더 드는 이유", "feature": "레시피 매칭", "done": true, "why": "재료를 사도 한 번 쓰고 버리고 또 사는 악순환 → 요리가 배달보다 비싸짐", "hook": "요리할수록\n돈이 더 드는 이유", "hookKind": "❓ 이유 묻기 — 「그게 뭔데?」 → 재료를 요리마다 새로 사서", "who": "출연자 W(여자)", "lines": ["요리할수록 돈이 더 드는 사람, 이유가 딱 하나예요. 재료를 요리마다 새로 사거든요. 한 번 쓰고 남은 건 버리고 또 사고. 그러니까 배달보다 비싸요.", "저도 그래서 요리를 아예 놓았었어요. 맛없고 비싸고 힘드니까요. 그러다 남은 재료부터 쓰게 해 주는 앱을 찾았는데, 그게 쿡매치예요.", "냉장고 재료를 담아 두면, 지금 있는 재료로 만들 수 있는 요리가 몇 퍼센트 맞는지까지 순서대로 떠요. 한두 개 없으면 있는 재료로 바꿔 주고요."], "copies": [{"label": "① 출연자 사진", "text": "인스타그램 릴스의 한 장면처럼, 폰 전면 카메라로 셀카를 찍은 9:16 세로(1080×1920) 실사 사진을 만들어 줘.\n\n[사람]\n30대 초반 한국 여자. 배우처럼 또렷하고 호감 가는 예쁜 얼굴, 맑은 피부, 자연스러운 옅은 화장, 어깨 길이의 부드러운 갈색 웨이브 머리. 크림색 니트.\n\n[장소]\n밝은 아파트 주방. 뒤로 흰 수납장과 창으로 드는 부드러운 햇빛, 배경은 살짝 흐리다.\n\n[구도·표정]\n한 손으로 폰을 들고 셀카를 찍는 자세(폰은 화면에 안 보인다). 렌즈를 똑바로 보며 말을 시작하려는 밝은 표정. 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백.\n\n[꼭 지킬 것]\n부드러운 자연광, 깨끗하고 밝은 피부톤, 배경은 살짝 흐리게. 편집하지 않은 깨끗한 사진, 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "클립 1", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n출연자 W 한 명이 셀카처럼 폰을 들고, 쿡매치의 「레시피 매칭」 기능을 친구에게 알려 주듯 쉬지 않고 말하는 약 10초 장면(1/3, 첫마디·공감 — 보는 사람을 붙잡고 문제를 구체적으로).\n\n[꼭 지킬 것]\n1. 편집 전 원본 촬영분. 화면에는 사람과 공간만 보이고, 화면 위에는 자막·글자·효과 글자가 하나도 없다. 말은 소리로만 들린다.\n2. 사람은 한 명뿐이다. 첨부한 사진이 있으면 그 사진 속 사람과 같은 얼굴·머리·옷·장소로 이어 간다.\n3. 출연자가 한 손으로 폰을 들고 셀카로 찍듯, 렌즈(보는 사람)를 똑바로 보며 혼자 말한다. 친구에게 꿀팁을 알려 주듯 빠르고 신나게, 처음부터 끝까지 쉬지 않고 아주 빠르게 이어서 말한다 — 1초에 8음절 정도, 친구에게 신나서 수다 떨듯. 문장 사이에 멈추지 않고 바로 다음 문장을 붙인다. 느리게 또박또박 읽지 않는다. 문장 사이는 아주 짧게 숨만 쉰다. 광고 성우처럼 과장하지 않고 평소 말투(해요체). 입 모양은 한국어 대사와 정확히 맞는다.\n4. 말에 맞춰 표정이 살아 있다: 눈썹 올리기, 고개 끄덕임, 웃음, 「진짜요」 하는 눈빛. 폰을 들지 않은 손은 가끔 가슴 높이에서 가볍게 손짓한다. 걷거나 물건을 집지 않는다. 손가락은 다섯 개.\n5. 셀카 구도: 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백. 폰을 든 손 때문에 화면이 아주 살짝 자연스럽게 흔들리는 정도는 괜찮지만, 확대·회전·이동은 없다. 얼굴·머리·옷은 끝까지 같다.\n6. 부드러운 자연광, 깨끗하고 밝은 피부톤. 소리는 출연자의 말과 조용한 방 소리뿐, 음악 없음.\n\n[출연자]\n30대 초반 한국 여자. 배우처럼 또렷하고 호감 가는 예쁜 얼굴, 맑은 피부, 자연스러운 옅은 화장, 어깨 길이의 부드러운 갈색 웨이브 머리. 크림색 니트. 목소리: 밝고 또렷한 30대 여자 목소리, 중간 높이, 서울말.\n\n[장소]\n밝은 아파트 주방. 뒤로 흰 수납장과 창으로 드는 부드러운 햇빛, 배경은 살짝 흐리다.\n\n[장면 순서 — 이 순서대로 한 번씩]\n1) 0~0.3초: 렌즈를 보며 첫 0.3초 안에 바로 말을 시작한다(멈춰 있는 표정으로 오래 시작하지 않는다).\n2) 0.3~9.4초: 검지를 세우며 비밀을 알려 주듯 시작해, 끝에 허탈하게 웃는다. — 이 사람 목소리로, 아주 빠르게 쉬지 않고 이어서 아래 대사를 10초 안에 모두 말한다: \"요리할수록 돈이 더 드는 사람, 이유가 딱 하나예요. 재료를 요리마다 새로 사거든요. 한 번 쓰고 남은 건 버리고 또 사고. 그러니까 배달보다 비싸요.\"\n3) 9.4~10초: 말을 마치고 렌즈를 본 채 작게 웃는다. — 말 없음\n\n[마지막 장면]\n렌즈를 보는 출연자의 얼굴.\n\n9:16 세로(1080×1920) 인스타그램 릴스 영상으로."}, {"label": "클립 2", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n출연자 W 한 명이 셀카처럼 폰을 들고, 쿡매치의 「레시피 매칭」 기능을 친구에게 알려 주듯 쉬지 않고 말하는 약 10초 장면(2/3, 나도 그랬다 — 그러다 쿡매치를 만남).\n\n[꼭 지킬 것]\n1. 편집 전 원본 촬영분. 화면에 n5. 셀카 구도: 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백. 폰을 든 손 때문에 화면이 아주 살짝 자연스럽게 흔들리는 정도는 괜찮지만, 확대·회전·이동은 없다. 얼굴·머리·옷은 끝까지 같다.\n6. 부드러운 자연광, 깨끗하고 밝은 피부톤. 소리는 출연자의 말과 조용한 방 소리뿐, 음악 없음.\n\n[출연자]\n30대 초반 한국 여자. 배우처럼 또렷하고 호감 가는 예쁜 얼굴, 맑은 피부, 자연스러운 옅은 화장, 어깨 길이의 부드러운 갈색 웨이브 머리. 크림색 니트. 목소리: 밝고 또렷한 30대 여자 목소리, 중간 높이, 서울말.\n\n[장소]\n밝은 아파트 주방. 뒤로 흰 수납장과 창으로 드는 부드러운 햇빛, 배경은 살짝 흐리다.\n\n[장면 순서 — 이 순서대로 한 번씩]\n이 클립은 앞 영상에서 이어지는 말이다. 인사나 도입 없이, 이미 말하던 사람처럼 바로 이어서 말한다.\n1) 0~0.3초: 렌즈를 보며 첫 0.3초 안에 바로 말을 시작한다(멈춰 있는 표정으로 오래 시작하지 않는다).\n2) 0.3~9.4초: 화면을 설명하듯 손으로 가리키며 또박또박. — 이 사람 목소리로, 아주 빠르게 쉬지 않고 이어서 아래 대사를 10초 안에 모두 말한다: \"냉장고 재료를 담아 두면, 지금 있는 재료로 만들 수 있는 요리가 몇 퍼센트 맞는지까지 순서대로 떠요. 한두 개 없으면 있는 재료로 바꿔 주고요.\"\n3) 9.4~10초: 말을 마치고 렌즈를 본 채 작게 웃는다. — 말 없음\n\n[마지막 장면]\n렌즈를 보는 출연자의 얼굴.\n\n9:16 세로(1080×1920) 인스타그램 릴스 영상으로."}]}, {"no": "02", "title": "한 시간 요리하고 결국 김에 밥", "feature": "검증된 레시피", "done": true, "why": "배고픈 딸 앞에서 레시피 따라 하느라 한 시간 → 결국 김에 밥, 만든 요리는 아무도 안 먹음", "hook": "한 시간 요리하고\n결국 김에 밥", "hookKind": "❓ 반전 — 「왜 그렇게 됐지?」 → 레시피 읽느라 한 시간", "who": "출연자 02(여자)", "lines": ["딸이 배고프다고 해서 저녁을 시작했어요. 레시피 찾고, 읽고, 따라 하다 보니까 한 시간이 가더라고요.", "애는 울고, 저도 울고 싶고. 결국 김에 밥 싸 줬어요. 한 시간 걸린 그 요리는 아무도 안 먹었고요.", "요즘은 쿡매치에서 빨리 되는 레시피부터 봐요. 순서만 딱 정리돼 있어서, 이제 금방 해요."], "copies": [{"label": "① 출연자 사진", "text": "집에서 폰 전면 카메라로 대충 찍은 셀카 같은 9:16 세로(1080×1920) 실사 사진을 만들어 줘. 광고 사진이 아니라 일상 사진처럼.\n\n[사람]\n30대 초반 한국 여자. 호감 가는 예쁜 얼굴이지만 꾸미지 않은 일반인처럼 자연스럽다. 화장은 거의 안 했고, 단발머리를 한쪽 귀 뒤로 넘김. 연회색 니트 홈웨어.\n\n[장소]\n저녁의 거실 겸 주방. 실내 조명, 뒤로 식탁 위에 아이 식판과 컵, 구석에 장난감 바구니가 살짝 보이고 배경은 흐리다.\n\n[구도·표정]\n한 손으로 폰을 들고 셀카를 찍는 자세(폰은 화면에 안 보인다). 렌즈를 보며 막 말을 꺼내려는 편안한 표정, 살짝 웃는 정도. 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백.\n\n[꼭 지킬 것]\n집 실내 조명 그대로, 피부 보정 없음, 배경은 살짝 흐리게. 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "클립 1", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n출연자 02 한 명이 집에서 폰을 들고, 친한 친구한테 자기 얘기를 하듯 평소 속도로 말하는 약 10초 일상 셀카 영상(1/3, 첫마디 — 내 얘기를 꺼냄). 광고처럼 보이지 않는다.\n\n[꼭 지킬 것]\n1. 편집 전 원본 촬영분. 화면에는 사람과 공간만 보이고, 화면 위에는 자막·글자·효과 글자가 하나도 없다. 말은 소리로만 들린다.\n2. 사람은 한 명뿐이다. 첨부한 사진이 있으면 그 사진 속 사람과 같은 얼굴·머리·옷·장소로 이어 간다.\n3. 광고가 아니라 집에서 폰으로 대충 찍은 일상 영상처럼 보인다. 출연자가 한 손으로 폰을 들고 렌즈를 보며, 친한 친구한테 얘기하듯 평소 속도로 말한다. 생각하면서 말하듯 문장 사이에 아주 잠깐 멈추기도 한다. 신나게 홍보하거나 과장하지 않는다. 성우 말투가 아닌 평소 말투(해요체). 입 모양은 한국어 대사와 정확히 맞는다.\n4. 표정은 작고 자연스럽다: 살짝 웃음, 멋쩍은 웃음, 고개를 살짝 끄덕임. 큰 손짓·눈 크게 뜨기·엄지척 같은 과한 동작은 없다. 걷거나 물건을 집지 않는다. 손가락은 다섯 개.\n5. 셀카 구도: 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백. 손에 든 폰이라 화면이 아주 살짝 흔들리는 정도는 괜찮지만, 확대·회전·이동은 없다. 얼굴·머리·옷은 끝까지 같다.\n6. 집 실내 조명 그대로(저녁 주방 조명), 피부도 보정하지 않은 자연스러운 모습. 소리는 출연자의 말과 조용한 집 안 소리뿐, 음악 없음.\n\n[출연자]\n30대 초반 한국 여자. 호감 가는 예쁜 얼굴이지만 꾸미지 않은 일반인처럼 자연스럽다. 화장은 거의 안 했고, 단발머리를 한쪽 귀 뒤로 넘김. 연회색 니트 홈웨어. 목소리: 부드럽고 담담한 30대 여자 목소리, 서울말.\n\n[장소]\n저녁의 거실 겸 주방. 실내 조명, 뒤로 식탁 위에 아이 식판과 컵, 구석에 장난감 바구니가 살짝 보이고 배경은 흐리다.\n\n[장면 순서 — 이 순서대로 한 번씩]\n1) 0~0.3초: 렌즈를 보며 첫 0.3초 안에 바로 말을 시작한다(멈춰 있는 표정으로 오래 시작하지 않는다).\n2) 0.3~9.4초: 그날을 떠올리듯 담담하게 시작한다. — 이 사람 목소리로, 평소 속도로 자연스럽게 아래 대사를 10초 안에 모두 말한다: \"딸이 배고프다고 해서 저녁을 시작했어요. 레시피 찾고, 읽고, 따라 하다 보니까 한 시간이 가더라고요.\"\n3) 9.4~10초: 말을 마치고 렌즈를 본 채 작게 웃는다. — 말 없음\n\n[마지막 장면]\n렌즈를 보는 출연자의 얼굴.\n\n9:16 세로(1080×1920) 인스타그램 릴스 영상으로."}, {"label": "클립 2", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n출연자 02 한 명이 집에서 폰을 들고, 친한 친구한테 자기 얘기를 하듯 평소 속도로 말하는 약 10초 일상 셀카 영상(2/3, 그때 이야기). 광고처럼 보이지 않는다.\n\n[꼭 지킬 것]\n1. 편집 전 원본 촬영분. 화면에는 사람과 공간만 보이고, 화면 위에는 자막·글자·효과 글자가 하나도 없다. 말은 소리로만 들린다.\n2. 사람은 한 명뿐이다. 첨부한 사진이 있으면 그 사진 속 사람과 같은 얼굴·머리·옷·장소로 이어 간다.\n3. 광고가 아니라 집에서 폰으로 대충 찍은 일상 영상처럼 보인다. 출연자가 한 손으로 폰을 들고 렌즈를 보며, 친한 친구한테 얘기하듯 평소 속도로 말한다. 생각하면서 말하듯 문장 사이에 아주 잠깐 멈추기도 한다. 신나게 홍보하거나 과장하지 않는다. 성우 말투가 아닌 평소 말투(해요체). 입 모양은 한국어 대사와 정확히 맞는다.\n4. 표정은 작고 자연스럽다: 살짝 웃음, 멋쩍은 웃음, 고개를 살짝 끄덕임. 큰 손짓·눈 크게 뜨기·엄지척 같은 과한 동작은 없다. 걷거나 물건을 집지 않는다. 손가락은 다섯 개.\n5. 셀카 구도: 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백. 손에 든 폰이라 화면이 아주 살짝 흔들리는 정도는 괜찮지만, 확대·회전·이동은 없다. 얼굴·머리·옷은 끝까지 같다.\n6. 집 실내 조명 그대로(저녁 주방 조명), 피부도 보정하지 않은 자연스러운 모습. 소리는 출연자의 말과 조용한 집 안 소리뿐, 음악 없음.\n\n[출연자]\n30대 초반 한국 여자. 호감 가는 예쁜 얼굴이지만 꾸미지 "03", "title": "요리가 싫었던 진짜 이유", "feature": "요리 모드", "done": true, "why": "레시피를 읽고 이해하느라 지쳤는데, 읽어 주니 요리 시간이 기다려짐", "hook": "요리가 싫었던\n진짜 이유", "hookKind": "❓ 진짜 이유 — 요리가 아니라 레시피 보는 게 힘들었다", "who": "출연자 03(여자)", "lines": ["저 요리 못하는 줄 알았거든요. 근데 아니더라고요. 레시피 보는 게 힘들었던 거예요.", "한 줄 보고, 손 씻고, 다시 폰 켜고. 어디까지 했지, 하는 사이에 딸은 배고프다고 하고.", "요즘은 쿡매치가 한 줄씩 읽어 줘요. 저는 듣고 손만 움직이면 되니까, 이제 좀 할 만해요."], "copies": [{"label": "① 출연자 사진", "text": "집에서 폰 전면 카메라로 대충 찍은 셀카 같은 9:16 세로(1080×1920) 실사 사진을 만들어 줘. 광고 사진이 아니라 일상 사진처럼.\n\n[사람]\n20대 후반~30대 초반 한국 여자. 호감 가는 예쁜 얼굴이지만 모델이 아니라 평범한 일반인처럼 자연스럽다. 화장은 거의 안 했고, 머리는 집게 핀으로 대충 올려 묶음. 회색 맨투맨(집에서 입는 편한 옷).\n\n[장소]\n저녁의 실제 사는 집 주방. 천장 조명 아래, 뒤로 개수대와 그릇 몇 개, 양념통이 조금 어수선하게 보이고 배경은 살짝 흐리다.\n\n[구도·표정]\n한 손으로 폰을 들고 셀카를 찍는 자세(폰은 화면에 안 보인다). 렌즈를 보며 막 말을 꺼내려는 편안한 표정, 살짝 웃는 정도. 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백.\n\n[꼭 지킬 것]\n집 실내 조명 그대로, 피부 보정 없음, 배경은 살짝 흐리게. 사진 위에 글자가 하나도 없다.\n\n9:16 세로(1080×1920) 사진으로.", "main": true}, {"label": "클립 1", "text": "이 영상은 인스타그램 릴스용 9:16 세로 화면(1080×1920)으로 만들어 줘.\n\n[한 줄 요약]\n출연자 03 한 명이 집에서 폰을 들고, 친한 친구한테 자기 얘기를 하듯 평소 속도로 말하는 약 10초 일상 셀카 영상(1/3, 첫마디 — 내 얘기를 꺼냄). 광고처럼 보이지 않는다.\n\n[꼭 지킬 것]\n1. 편집 전 원본 촬영분. 화면에는 사람과 공간만 보이고, 화면 위에는 자막·글자·효과 글자가 하나도 없다. 말은 소리로만 들린다.\n2. 사람은 한 명뿐이다. 첨부한 사진이 있으면 그 사진 속 사람과 같은 얼굴·머리·옷·장소로 이어 간다.\n3. 광고가 아니라 집에서 폰으로 대충 찍은 일상 영상처럼 보인다. 출연자가 한 손으로 폰을 들고 렌즈를 보며, 친한 친구한테 얘기하듯 평소 속도로 말한다. 생각하면서 말하듯 문장 사이에 아주 잠깐 멈추기도 한다. 신나게 홍보하거나 과장하지 않는다. 성우 말투가 아닌 평소 말투(해요체). 입 모양은 한국어 대사와 정확히 맞는다.\n4. 표정은 작고 자연스럽다: 살짝 웃음, 멋쩍은 웃음, 고개를 살짝 끄덕임. 큰 손짓·눈 크게 뜨기·엄지척 같은 과한 동작은 없다. 걷거나 물건을 집지 않는다. 손가락은 다섯 개.\n5. 셀카 구도: 얼굴과 어깨가 화면 위쪽 절반을 채우고, 머리 위로 조금 여백. 손에 든 폰이라 화면이 아주 살짝 흔들리는 정도는 괜찮지만, 확대·회전·이동은 없다. 얼굴·머리·옷은 끝까지 같다.\n6. 집 실내 조명 그대로(저녁 주방 조명), 피부도 보정하지 않은 자연스러운 모습. 소리는 출연자의 말과 조용한 집 안 소리뿐, 음악 없음.\n\n[출연자]\n20대 후반~30대 초반 한국 여자. 호감 가는 예쁜 얼굴이지만 모델이 아니라 평범한 일반인처럼 자연스럽다. 화장은 거의 안 했고, 머리는 집게 핀으로 대충 올려 묶음. 회색 맨투맨(집에서 입는 편한 옷). 목소리: 차분하고 편안한 30대 여자 목소리, 서울말.\n\n[장소]\n저녁의 실제 사는 집 주방. 천장 조명 아래, 뒤로 개수대와 그릇 몇 개, 양념통이 조금 어수선하게 보이고 배경은 살짝 흐리다.\n\n const HOW = {
  hooks5: `<b>후킹 5벌 뽑는 순서</b> (4벌과 같은 방식)<ol><li>「① 첫 장면 사진」으로 사진을 먼저 만들어요.</li><li><b>새 대화</b>에 그 사진을 첨부하고 「② 영상 프롬프트」를 붙여 넣어요(약 10초).</li><li>뽑은 영상을 보내 주시면 기능 화면을 붙여 완성해요.</li></ol>`,
  hooks: `<b>후킹 영상 뽑는 순서</b><ol><li>「첫 장면 이미지」로 사진을 먼저 만들어요.</li><li>새 대화에 그 사진을 첨부하고 「영상 프롬프트」를 붙여 넣어요(한 번에 약 10초).</li><li>대사가 꼬이면 「대사 없는 버전」으로 뽑고, 대사는 편집에서 얹어요.</li><li>뽑은 영상을 보내 주시면 기능 화면을 붙여 완성해요.</li></ol>`,
  talks: `<b>출연자 셀카형 뽑는 순서</b><ol><li>「① 출연자 사진」으로 그 편 출연자 사진을 먼저 만들어요.</li><li>클립 1·2·3을 하나씩, 매번 <b>새 대화</b>에 같은 사진을 첨부해서 붙여 넣어요.</li><li>세 영상을 보내 주시면 이어 붙이고 자막·기능 화면·끝 화면까지 넣어요.</li></ol>`,
};
let tab = "hooks5";
try { tab = localStorage.getItem("hub_make_tab5") || "hooks5"; } catch (e) {}
if (!DATA[tab]) tab = "hooks5";

const toast = $("#toast"); let tt;
function copy(text, pre) {
  const ok = () => { toast.textContent = "복사했어요"; toast.hidden = false; clearTimeout(tt); tt = setTimeout(() => toast.hidden = true, 1400); };
  const fb = () => { pre.hidden = false; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast.textContent = "선택했어요. 길게 눌러 복사하세요"; toast.hidden = false; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}

function card(c) {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <div class="top"><span class="no">${esc(c.no)}</span><span class="feat">${esc(c.feature)}${c.who ? " · " + esc(c.who) : ""}</span>
      <span class="st ${c.done ? "ok" : ""}">${c.done ? "만듦" : "만들 차례"}</span></div>
    <h3>${esc(c.title)}</h3>
    <div class="hook">${esc(c.hook)}<small>${esc(c.hookKind)}</small></div>
    <p class="why">${esc(c.why)}</p>
    ${c.lines ? `<ol class="lines">${c.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ol>` : ""}
    <div class="btns">${c.copies.map((x, i) => `<button class="btn ${x.main ? "main" : ""}" type="button" data-i="${i}">${esc(x.label)} 복사</button>`).join("")}</div>
    <pre hidden></pre>`;
  const pre = $("pre", el);
  el.querySelectorAll("button[data-i]").forEach(b => b.addEventListener("click", () => {
    const x = c.copies[+b.dataset.i]; pre.textContent = x.text; copy(x.text, pre);
  }));
  return el;
}

function render() {
  const cards = DATA[tab];
  $("#how").innerHTML = HOW[tab];
  const todo = cards.filter(c => !c.done), done = cards.filter(c => c.done);
  $("#hTodo").textContent = `만들 차례 ${todo.length}편`;
  $("#hDone").textContent = `다 만든 편 ${done.length}편`;
  $("#todo").replaceChildren(...todo.map(card));
  $("#done").replaceChildren(...done.map(card));
  document.querySelectorAll(".tab[data-t]").forEach(x => x.setAttribute("aria-pressed", x.dataset.t === tab ? "true" : "false"));
}
document.querySelectorAll(".tab[data-t]").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.t; try { localStorage.setItem("hub_make_tab5", tab); } catch (e) {} render();
}));
render();

/* ── 상위 탭: 인스타그램 / 스레드 ── */
const SUB = { ig: "제미나이로 뽑을 프롬프트만 모았어요. 만들 차례인 편이 위에 있어요.",
  th: "@yoalmot.mom · 초안을 고치고 올리기를 누르면 15분 안에 스레드에 올라가요(PC·Claude 앱이 켜져 있을 때)." };
let main = "ig";
try { main = localStorage.getItem("hub_make_main") || "ig"; } catch (e) {}
try { const h = location.hash.slice(1); if (h === "threads") main = "th"; if (h === "instagram") main = "ig"; } catch (e) {}
function showMain() {
  $("#ig").hidden = main !== "ig"; $("#th").hidden = main !== "th"; $("#sub").textContent = SUB[main];
  document.querySelectorAll(".mtab").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === main)));
}
document.querySelectorAll(".mtab").forEach(b => b.addEventListener("click", () => {
  main = b.dataset.m; try { localStorage.setItem("hub_make_main", main); } catch (e) {} showMain();
}));
showMain();
</script>
